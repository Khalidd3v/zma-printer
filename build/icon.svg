    <rect x="136" y="380" width="240" height="40" rx="4" fill="#FFFFFF" />
    <rect x="156" y="360" width="200" height="20" fill="#94A3B8" />
    <!-- Printer Indicator Light -->
    <circle cx="372" cy="288" r="12" fill="#10B981" />
    <circle cx="332" cy="288" r="12" fill="#CBD5E1" />
