appId: com.zmapos.printeragent
productName: Zma Printer Agent
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.business
  target:
    - dmg
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target:
    - AppImage
  category: Office
extraResources:
  - "resources/**"
