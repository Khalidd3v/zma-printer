appId: com.zmapos.printeragent
productName: Zma Printer Agent
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
compression: maximum
npmRebuild: false
electronLanguages:
  - en-US
  - en-GB
mac:
  category: public.app-category.business
  target:
    - dmg
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
win:
  target:
    - nsis
    - portable
  artifactName: "${productName}-${version}-windows-${arch}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  differentialPackage: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: "${productName}-${version}-windows-${arch}-PORTABLE.${ext}"
linux:
  target:
    - AppImage
  category: Office
extraResources:
  - "resources/**"
